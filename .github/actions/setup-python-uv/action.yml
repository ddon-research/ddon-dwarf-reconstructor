name: Set up DDON Python and uv
description: Install the pinned Python runtime, uv, and the locked project dependencies.

inputs:
  working-directory:
    description: Project directory containing the uv project and lockfile.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up CPython 3.14.7
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14.7"

    - name: Install uv with dependency caching
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.3"
        python-version: "3.14.7"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        working-directory: ${{ inputs.working-directory }}

    - name: Check uv lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv lock --check

    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --python 3.14.7 --locked
