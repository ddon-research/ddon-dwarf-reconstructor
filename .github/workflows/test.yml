name: Required Correctness Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python and uv
      uses: ./.github/actions/setup-python-uv

    - name: Verify test taxonomy and required integration collection
      run: |
        uv run pytest --collect-only -q
        uv run pytest --collect-only -q -m "integration and not performance and not real_asset"

    - name: Run required correctness tests with coverage
      run: uv run just coverage-ci
        
    - name: Generate coverage report
      run: uv run coverage report --show-missing
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: correctness
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: |
          test-results.xml
          coverage.xml
          htmlcov/
        retention-days: 14

    - name: Publish test results
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      with:
        files: test-results.xml
        check_name: "Correctness Test Results"
        comment_mode: off
