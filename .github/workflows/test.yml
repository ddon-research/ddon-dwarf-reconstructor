name: Required Correctness Tests and Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Python 3.14.6
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.6'
        
    - name: Install uv
      uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        
    - name: Install dependencies
      run: uv sync --python 3.14.6 --frozen
        
    - name: Verify test taxonomy and required integration collection
      run: |
        uv run pytest --collect-only -q
        uv run pytest --collect-only -q -m "integration and not performance and not real_asset"

    - name: Run required correctness tests with coverage
      run: uv run just coverage-ci
        
    - name: Generate coverage report
      run: uv run coverage report --show-missing
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: correctness
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results
        path: |
          test-results.xml
          coverage.xml
          htmlcov/
        retention-days: 30
        
    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
      continue-on-error: true
      with:
        files: test-results.xml
        check_name: "Correctness Test Results"
