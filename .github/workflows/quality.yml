name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14.6'
        
    - name: Install uv
      uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        
    - name: Install dependencies
      run: uv sync --python 3.14.6 --frozen

    - name: Run locked quality checks
      run: uv run just check

    - name: Verify uv tool installation
      run: uv run just package-smoke

    - name: Run Prospector diagnostics
      continue-on-error: true
      run: uv run just audit
