name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.6'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v6
        
    - name: Install dependencies
      run: |
        uv sync --python 3.14.6 --extra dev --frozen
        
    - name: Run ruff linter
      run: |
        uvx ruff check --no-fix src/ tests/ --output-format=github
        
    - name: Run ruff formatter check
      run: |
        uvx ruff format src/ tests/ --check --diff
        
    - name: Run mypy type checker
      run: |
        uv run mypy src/

    - name: Check Python structure budgets
      run: |
        uv run python scripts/quality/check_structure.py

    - name: Check DDD and hexagonal boundaries
      run: |
        uv run python scripts/quality/check_boundaries.py

    - name: Run Prospector diagnostics
      continue-on-error: true
      run: |
        uv run prospector --profile .prospector.yml --tool pylint --tool pyflakes --tool mccabe src/
