name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Node.js 24.14.1
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24.14.1"
        cache: npm
        cache-dependency-path: tools/documentation/package-lock.json

    - name: Install documentation validators
      run: npm ci --prefix tools/documentation --no-audit --no-fund

    - name: Set up Python and uv
      uses: ./.github/actions/setup-python-uv

    - name: Install actionlint v1.7.12
      shell: bash
      env:
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}.tar.gz"
        install_dir="$RUNNER_TEMP/actionlint"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location \
          --output "$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
        tar -xzf "$archive" -C "$install_dir" actionlint
        "$install_dir/actionlint" -version
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Run locked quality checks
      run: uv run just check

    - name: Verify uv tool installation
      run: uv run just package-smoke

    - name: Run required Prospector diagnostics
      run: uv run just audit
