name: DWARF Specification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tool-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/dwarf_spec_pipeline
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: tools/dwarf_spec_pipeline

      - name: Run locked tool checks and required integration tests
        run: uv run just ci

      - name: Validate Docker Compose configuration
        working-directory: .
        run: uv run --directory tools/dwarf_spec_pipeline just docker-config
