name: DWARF Specification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tool-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dwarf_spec_pipeline
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14.6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install tool dependencies
        run: uv sync --python 3.14.6 --frozen

      - name: Run locked tool checks and required integration tests
        run: uv run just ci

      - name: Validate Docker Compose configuration
        working-directory: .
        run: uv run --directory tools/dwarf_spec_pipeline just docker-config
