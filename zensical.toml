[project]
site_name = "DDON DWARF Reconstructor"
site_description = "Source-backed documentation for deterministic C++ header reconstruction from ELF/DWARF evidence."
site_author = "DDON Research"
site_url = "https://ddon-research.github.io/ddon-dwarf-reconstructor/"
repo_url = "https://github.com/ddon-research/ddon-dwarf-reconstructor"
repo_name = "ddon-research/ddon-dwarf-reconstructor"
copyright = "Copyright &copy; 2026 DDON Research"
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "First generation" = "tutorials/first-generation.md" },
  ] },
  { "How-to" = [
    { "Generate headers" = "how-to/generate-headers.md" },
    { "Export the knowledge graph" = "how-to/export-knowledge-graph.md" },
    { "Inspect durable artifacts" = "how-to/inspect-artifacts.md" },
