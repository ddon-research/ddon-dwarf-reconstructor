name: ddon-langfuse

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-postgres}"
  SALT: "${SALT:?SALT must be set}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}"
  TELEMETRY_ENABLED: "${TELEMETRY_ENABLED:-false}"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "${CLICKHOUSE_USER:-clickhouse}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}"
  CLICKHOUSE_CLUSTER_ENABLED: "${CLICKHOUSE_CLUSTER_ENABLED:-false}"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minio}"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}"
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: "${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minio}"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_AUTH: "${REDIS_AUTH:?REDIS_AUTH must be set}"
  LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"
  REDIS_TLS_ENABLED: "false"

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: "${LANGFUSE_WORKER_IMAGE:-docker.io/langfuse/langfuse-worker:4}"
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-environment

  langfuse-web:
    image: "${LANGFUSE_IMAGE:-docker.io/langfuse/langfuse:4}"
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "${LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT:-http://localhost:9090}"

  clickhouse:
    image: "docker.io/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.12}"
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: "default"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-clickhouse}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: "${MINIO_IMAGE:?MINIO_IMAGE must be set}"
    restart: unless-stopped
    entrypoint: ["sh"]
    command:
      - "-c"
      - "mkdir -p /data/langfuse && minio server --address ':9000' --console-address ':9001' /data"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9090}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: "docker.io/library/redis:${REDIS_VERSION:-7}"
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_AUTH:?REDIS_AUTH must be set}"
      - "--maxmemory-policy"
      - "noeviction"
    environment:
      REDIS_AUTH: "${REDIS_AUTH:?REDIS_AUTH must be set}"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_AUTH\" ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: "docker.io/library/postgres:${POSTGRES_VERSION:-17}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  langfuse_postgres_data:
    name: ddon-langfuse-postgres
  langfuse_clickhouse_data:
    name: ddon-langfuse-clickhouse
  langfuse_clickhouse_logs:
    name: ddon-langfuse-clickhouse-logs
  langfuse_minio_data:
    name: ddon-langfuse-minio
  langfuse_redis_data:
    name: ddon-langfuse-redis
