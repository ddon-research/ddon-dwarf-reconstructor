[project]
name = "ddon-dwarf-reconstructor"
version = "0.1.0"
description = "Reconstructs C/C++ header structures from DWARF debug symbols in PS4 ELF files"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = "==3.14.6"
dependencies = [
    "pyelftools>=0.31",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "typer>=0.16,<1",
]
license = "GPL-3.0-or-later"
keywords = [
    "dwarf", 
    "elf", 
    "debug-symbols", 
    "reverse-engineering", 
    "ps4", 
    "c++", 
    "header-reconstruction",
    "binary-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Software Distribution",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
"Source Code" = "https://github.com/ddon-research/ddon-dwarf-reconstructor"
"Bug Tracker" = "https://github.com/ddon-research/ddon-dwarf-reconstructor/issues"
Documentation = "https://github.com/ddon-research/ddon-dwarf-reconstructor/tree/main/docs"

[project.scripts]
ddon-dwarf-reconstructor = "ddon_dwarf_reconstructor.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddon_dwarf_reconstructor"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "src/ddon_dwarf_reconstructor/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--maxfail=1",
    "--disable-warnings",
    "-q",
    "--tb=short", 
    "--strict-markers",
    "--color=yes",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests", 
    "unit: marks tests as unit tests",
    "performance: marks tests as performance benchmarks",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s: %(message)s"

[tool.pyrefly]
project-includes = ["src/**/*.py", "scripts/**/*.py"]
search-path = ["src"]
python-version = "3.14"
preset = "default"
ignore-missing-imports = ["elftools.*"]
check-unannotated-defs = true
infer-return-types = "checked"

[tool.deptry]
known_first_party = ["ddon_dwarf_reconstructor"]
extend_exclude = ["^tools[/\\\\]dwarf_spec_pipeline"]

[tool.deptry.package_module_name_map]
pyelftools = ["elftools"]
python-dotenv = ["dotenv"]

[tool.ruff]
line-length = 100
target-version = "py314"
fix = true
exclude = [
    "build",
    "dist", 
    ".venv",
    "__pycache__",
    "src/**/migrations",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "B", "UP", "SIM"]
ignore = [
    "UP047",   # keep TypeVar syntax where it remains clearer
    "E501",    # line too long (handled by formatter, allow long docstrings/debug statements)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E501",    # line too long (tests can be more verbose)
    "PLR2004", # magic values in tests are OK
]

"src/ddon_dwarf_reconstructor/cli.py" = ["B008"]
"src/ddon_dwarf_reconstructor/artifact_cli.py" = ["B008"]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "pytest-mock>=3.10",
    "pytest-html>=3.1.0",
    "hypothesis>=6.0",
    "pytest-regressions>=2.0",
]
lint = ["ruff>=0.12,<1"]
type = [
    "pyrefly>=1.2,<2",
    "types-psutil>=7,<8",
]
quality = [
    "deptry>=0.25,<1",
    "prospector==1.19.1",
]
tools = [
    "nuitka>=2.7.16",
    "rust-just>=1.42,<2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "quality" },
    { include-group = "tools" },
]
