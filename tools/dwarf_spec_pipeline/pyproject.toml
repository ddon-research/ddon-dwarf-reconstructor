[project]
name = "ddon-dwarf-spec-pipeline"
version = "0.1.0"
description = "Convert DWARF 2, 3, and 4 specifications into deterministic JSON and Markdown"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "jsonschema>=4.25,<5",
    "lxml>=6.0,<7",
    "pydantic>=2.11,<3",
    "python-docx>=1.2,<2",
    "typer>=0.16,<1",
]

[project.scripts]
dwarf-spec-pipeline = "dwarf_spec_pipeline.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwarf_spec_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--tb=short"]
markers = [
    "unit: fast isolated tests",
    "integration: tests that exercise deterministic source conversion components",
    "acceptance: user-visible or externally validated artifact workflows",
    "functional: verifies behavior or published output",
    "regression: pins a stable output or previously observed failure",
    "non_functional: verifies performance, quality, or operational behavior",
    "real_artifact: requires generated official artifacts or external source state",
    "official: validates the checked-in official-source knowledge artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
python-version = "3.14"
preset = "default"
check-unannotated-defs = true
infer-return-types = "checked"

[tool.deptry]
known_first_party = ["dwarf_spec_pipeline"]

[tool.deptry.package_module_name_map]
beautifulsoup4 = ["bs4"]
python-docx = ["docx"]

[tool.ruff.lint.per-file-ignores]
"src/dwarf_spec_pipeline/cli.py" = ["B008"]

[dependency-groups]
test = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
]
lint = ["ruff>=0.12,<1"]
type = [
    "pyrefly>=1.2,<2",
    "types-jsonschema>=4,<5",
]
quality = ["deptry>=0.25,<1"]
tools = ["rust-just>=1.42,<2"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "quality" },
    { include-group = "tools" },
]
