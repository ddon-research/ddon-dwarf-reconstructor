[project]
name = "ddon-dwarf-spec-pipeline"
version = "0.1.0"
description = "Convert DWARF 2, 3, and 4 specifications into deterministic JSON and Markdown"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "jsonschema>=4.25,<5",
    "lxml>=6.0,<7",
    "pydantic>=2.11,<3",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
dwarf-spec-pipeline = "dwarf_spec_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwarf_spec_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--tb=short"]
markers = [
    "unit: fast isolated tests",
    "integration: tests that exercise source conversion or official artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
